<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="check-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="64" cy="116" rx="42" ry="6" fill="#0f172a" opacity="0.4"/>

  <!-- House body -->
  <rect x="24" y="56" width="80" height="54" rx="3" fill="url(#wall)" stroke="#334155" stroke-width="1"/>

  <!-- Roof -->
  <path d="M10 60 L64 16 L118 60" fill="none" stroke="url(#roof)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Roof fill -->
  <path d="M20 60 L64 22 L108 60 Z" fill="#1e3a5f" opacity="0.5"/>

  <!-- Chimney -->
  <rect x="84" y="22" width="12" height="28" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Door -->
  <rect x="49" y="76" width="20" height="34" rx="3" fill="#1e40af"/>
  <rect x="51" y="78" width="16" height="30" rx="2" fill="#1e3a8a"/>
  <circle cx="62" cy="94" r="2" fill="#60a5fa"/>

  <!-- Window left -->
  <rect x="29" y="66" width="16" height="16" rx="2" fill="#0c1829" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="67" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.25"/>
  <rect x="38" y="67" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.15"/>
  <rect x="30" y="75" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.15"/>
  <rect x="38" y="75" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.25"/>

  <!-- Window right -->
  <rect x="73" y="66" width="16" height="16" rx="2" fill="#0c1829" stroke="#334155" stroke-width="1"/>
  <rect x="74" y="67" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.15"/>
  <rect x="82" y="67" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.25"/>
  <rect x="74" y="75" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.25"/>
  <rect x="82" y="75" width="6" height="6" rx="1" fill="#60a5fa" opacity="0.15"/>

  <!-- Wrench (bottom-right badge) -->
  <circle cx="102" cy="98" r="18" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <g transform="translate(89, 85) scale(0.52) rotate(0)">
    <path d="M8 2C4 2 1 5.5 1 9.5c0 2 .8 3.8 2 5.2L16.5 28c.8.8 2 .8 2.8 0l2.8-2.8c.8-.8.8-2 0-2.8L8.5 9c0-.2 0-.3 0-.5 0-1.5 1-2.5 2.5-2.5.2 0 .3 0 .5 0l4-4C14 1.3 12.5 1 11 1 10 1 9 1.3 8 2z"
      fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
    <path d="M42 2c4 0 7 3.5 7 7.5 0 2-.8 3.8-2 5.2L33.5 28c-.8.8-2 .8-2.8 0l-2.8-2.8c-.8-.8-.8-2 0-2.8L41.5 9c0-.2 0-.3 0-.5 0-1.5-1-2.5-2.5-2.5-.2 0-.3 0-.5 0l-4-4C36 1.3 37.5 1 39 1c1 0 2 .3 3 1z"
      fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
  </g>

  <!-- Checkmark badge (top-right) -->
  <circle cx="106" cy="24" r="16" fill="url(#check-bg)"/>
  <circle cx="106" cy="24" r="14" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <path d="M97 24 L103 30 L115 18" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
